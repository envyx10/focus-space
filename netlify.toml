[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.4.2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP allows only what the app loads: its own bundle, the YouTube player,
# Google Fonts and the Supabase project. 'unsafe-inline' is for styles only (React style attributes).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://api-bdc.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
